status: UNAPPROVED_TEMPLATE
module_id: null
contract_version: "template-3"

scope:
  population_choice: null
  current_phase: null
  fixture_kind: null
  record_count: null
  selection_policy: null
  full_population_followup_required: null
  decision_source: null
  rationale: null
  proves: []
  does_not_prove: [] # No behavior is proven until the population, oracle, fixture, keys, comparisons, tolerances, producer, and proof boundary are human-approved.

key_columns: []

intake_manifest:
  path: null
  sha256: null

oracle:
  path: null
  sha256: null
  format: null
  representation_note: null

fixture_manifest:
  path: null
  sha256: null

producer:
  # Use an argv list, never a shell string. The runner replaces {python},
  # {root}, {run_id}, {attempt_id}, and {actual_output_path} tokens deterministically.
  command: []
  cwd: "."
  actual_output_path: null
  # Approved contracts should use artifacts/generated/{run_id}/{attempt_id}/actual.csv.
  timeout_seconds: 300

comparisons: []
# Example structure only; do not copy values without human approval:
# comparisons:
#   - name: score
#     expected_column: sas_score
#     actual_column: python_score
#     mode: absolute
#     tolerance: 1.0e-10
#     scale_floor: 1.0e-15
#     null_equal: false

decision_basis:
  source: null
  rationale: null

output:
  result_path: artifacts/evidence/runs/{run_id}/attempts/{attempt_id}/tieout_result.json
  summary_path: artifacts/evidence/runs/{run_id}/attempts/{attempt_id}/tieout_summary.md
  evidence_path: artifacts/evidence/runs/{run_id}/attempts/{attempt_id}/evidence.json

privacy:
  hash_keys_in_evidence: true
  include_values_in_evidence: false
  max_mismatches: 100

oracle_lock:
  status: UNAPPROVED
  human_approval_required: true
  approved_by: null
  approved_on: null
  approval_scope: null
  implementation_may_modify: false

notes:
  - The specify stage must replace every null or empty execution field with human-approved module values, including intake/oracle hashes and comparison rationale.
  - The test stage must create and hash the governed fixture manifest and expected oracle without deriving expected output from generated Python.
  - The generate stage must provide the producer declared above; the producer may write actual output only.
  - The validate stage must invoke the generic tie-out runner and cannot claim local parity without its PASS evidence.
  - Never copy keys, fixture sizes, columns, metrics, or tolerances from a documentation example.
